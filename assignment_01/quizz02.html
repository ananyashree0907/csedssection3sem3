<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSD Quiz</title>
    <link rel="stylesheet" href="quizz02.css">
</head>
<body>
    <div class="container">
        <h1>FSD QUIZ</h1>
        <p id="timer">Time: 30 seconds</p>
        <p id="questionNumber"></p>
        <h2 id="question"></h2>
        <div id="options"></div>
        <button id="submitBtn">Submit</button>
        <h2 id="result"></h2>
    </div>
    <script>
        let questions = [
            {
                question: "Which language is used to make a webpage interactive?",
                options: ["HTML", "CSS", "JavaScript", "Python"],
                answer: "JavaScript"
            },
            {
                question: "Which event occurs when the user clicks an element?",
                options: ["mouseover", "click", "keydown", "submit"],
                answer: "click"
            },
            {
                question: "Which event occurs when a keyboard key is pressed?",
                options: ["click", "keydown", "mouseover", "change"],
                answer: "keydown"
            },
            {
                question: "Which event occurs when the mouse pointer moves over an element?",
                options: ["mouseover", "keydown", "click", "submit"],
                answer: "mouseover"
            },
            {
                question: "Which event is used when a form is submitted?",
                options: ["submit", "click", "keydown", "mouseover"],
                answer: "submit"
            }
        ];
        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let time = 30;
        let timerInterval;
        let questionNumber = document.getElementById("questionNumber");
        let question = document.getElementById("question");
        let options = document.getElementById("options");
        let submitBtn = document.getElementById("submitBtn");
        let result = document.getElementById("result");
        let timerDisplay = document.getElementById("timer");
        function startTimer() {
            clearInterval(timerInterval);
            time = 30;
            timerDisplay.innerHTML = "Time: " + time + " seconds";
            timerInterval = setInterval(function() {
                time--;
                timerDisplay.innerHTML =
                    "Time: " + time + " seconds";
                if (time <= 0) {
                    clearInterval(timerInterval);
                    alert("Time is up!");
                    currentQuestion++;
                    if (currentQuestion < questions.length) {
                        showQuestion();
                        startTimer();
                    } else {
                        questionNumber.innerHTML = "";
                        question.innerHTML = "Quiz Completed!";
                        options.innerHTML = "";
                        submitBtn.style.display = "none";
                        result.innerHTML =
                            "Your Score: " + score +
                            " / " + questions.length;
                        timerDisplay.innerHTML = "";
                    }
                }
            }, 1000);
        }
        function showQuestion() {
            selectedAnswer = null;
            questionNumber.innerHTML =
                "Question " + (currentQuestion + 1) + " of 5";
            question.innerHTML =
                questions[currentQuestion].question;
            options.innerHTML = "";
            submitBtn.innerHTML = "Submit";
            let currentOptions =
                questions[currentQuestion].options;
            currentOptions.forEach(function(optionText) {
                let button =
                    document.createElement("button");
                button.innerHTML = optionText;
                button.classList.add("option");
                button.addEventListener("click", function() {
                    selectedAnswer = optionText;
                    let allOptions =
                        document.querySelectorAll(".option");
                    allOptions.forEach(function(btn) {
                        btn.classList.remove("correct");
                        btn.classList.remove("wrong");
                    });
                    if (optionText ===
                        questions[currentQuestion].answer) {
                        button.classList.add("correct");
                    } else {
                        button.classList.add("wrong");
                    }
                });
                options.appendChild(button);
            });
        }
        submitBtn.addEventListener("click", function() {
            if (selectedAnswer === null) {
                alert("Please select an answer first!");
                return;
            }
            clearInterval(timerInterval);
            if (selectedAnswer ===
                questions[currentQuestion].answer) {
                score++;
            }
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
                startTimer();
            }
            else {
                questionNumber.innerHTML = "";
                question.innerHTML = "Quiz Completed!";
                options.innerHTML = "";
                submitBtn.style.display = "none";
                timerDisplay.innerHTML = "";
                result.innerHTML =
                    "Your Score: " + score +
                    " / " + questions.length;
            }
        });
        showQuestion();
        startTimer();
    </script>
</body>
</html>
