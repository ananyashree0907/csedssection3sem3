<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        body
        {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1
        {
            color: darkblue;
            margin-top: 30px;
        }

        label
        {
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            width: 150px;
            text-align: left;
        }

        input
        {
            width: 220px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        button
        {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover
        {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <h1>STUDENT DETAILS</h1>

    <label>Name:</label>
    <input type="text" id="name" placeholder="enter name"><br><br>

    <label>Roll Number:</label>
    <input type="text" id="roll no" placeholder="enter roll number"><br><br>
    
    <label>Section:</label>
    <input type="text" id="Sec" placeholder="Enter section"><br>

    <button type="SUBMIT">Submit</button>
    
   
</body>
</html>
