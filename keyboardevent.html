<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1b1c1d, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #form {
            background: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        #h1 {
            text-align: center;
            color: #2d3436;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        p {
            margin: 15px 0 8px;
            font-weight: bold;
            color: #3d1515;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #16151d;
            box-shadow: 0 0 8px rgba(35, 21, 139, 0.4);
        }
    </style>

    <script>

    </script>
</head>

<body>
    <div id="form">
        <h1 id="h1">Keyboard Events</h1>

        <p>onkeydown</p>
        <input type="text" onkeydown="alert(this.value);">

        <p>onkeyup</p>
        <input type="text" onkeyup="alert(this.value);">

        <p>onkeypress</p>
        <input type="text" onkeypress="alert(this.value);">
    </div>
</body>
</html>
