<body>
    <h1>addition of 2 nos</h1>
    <label>enter the first no</label>
    <input type="number" id="num1"><br><br>
    <label>enetr the second no</label>
    <input type="number 2" id="num2"><br><br>
     <button onclick="addition()">add</button>
             <h3 id="result"></h3>

        function addition(){

             document.getElementById("result").innerHTML =
                "addition = " + addition;

        }
    </script>
